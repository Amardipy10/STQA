<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Tasks - Premium Task Manager</title>
    <meta name="description" content="A beautiful and dynamic task management application.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="app-container">
        <header>
            <h1>Lumina Tasks</h1>
            <p id="date-display">Today</p>
        </header>

        <form id="todo-form" class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit" id="add-btn" aria-label="Add task"><i class="fas fa-plus"></i></button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list">
            <!-- Tasks will be injected here -->
        </ul>
        
        <div class="empty-state" id="empty-state">
            <i class="fa-solid fa-clipboard-list"></i>
            <p>No tasks yet. Add one above!</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
